[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-chat-analysis"
version = "0.2.0"
description = "Analyze WhatsApp chat exports: stats, plots, sentiment, anomalies, phrase search."
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.2.0",
    "emoji>=2.0.0",
]

[project.optional-dependencies]
sentiment = ["transformers>=4.30.0", "torch>=2.0.0"]
ui = ["streamlit>=1.30.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
whatsapp-analysis = "whatsapp_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
